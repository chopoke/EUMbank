# Nginx 설정 파일
# /etc/nginx/sites-available/eumbank 위치에 복사하여 사용
# sudo cp nginx-eumbank.conf /etc/nginx/sites-available/eumbank
# sudo ln -s /etc/nginx/sites-available/eumbank /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl restart nginx

# HTTP 서버 설정
server {
    listen 80;
    server_name _;  # 실제 도메인이 있다면 여기에 입력 (예: yourdomain.com)

    # 클라이언트 최대 업로드 크기
    client_max_body_size 10M;

    # 프론트엔드 정적 파일 서빙
    root /var/www/html;
    index index.html;

    # 프론트엔드 라우팅 (React Router 등)
    location / {
        try_files $uri $uri/ /index.html;
        
        # 캐시 설정
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API 프록시
    location /api {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Spring Boot 애플리케이션 직접 프록시 (필요한 경우)
    location ~ ^/(login|admin|oauth2) {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 지원 (필요한 경우)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 정적 리소스 직접 서빙 (이미지, PDF 등)
    location /static {
        alias /var/www/html/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 로그 설정
    access_log /var/log/nginx/eumbank-access.log;
    error_log /var/log/nginx/eumbank-error.log;
}

