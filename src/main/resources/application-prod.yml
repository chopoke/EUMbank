# ===================================================================
# PRODUCTION CONFIGURATION
# ===================================================================
# 이 파일은 AWS EC2 프로덕션 환경용 설정입니다.
# 환경 변수를 통해 민감한 정보를 주입하세요.

server:
  port: 8081

# ===================================================================
# SPRING FRAMEWORK CONFIGURATION
# ===================================================================
spring:
  application:
    name: eum_bank

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.http.client.HttpClientAutoConfiguration
      - org.springframework.boot.autoconfigure.web.client.RestClientAutoConfiguration

  # --- Database Connection (MariaDB) ---
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/eum_bank?sessionVariables=time_zone='+09:00'
    username: ${DB_USER:eumbank_user} # 환경 변수에서 주입, 기본값: eumbank_user
    password: ${DB_PASS} # 환경 변수에서 주입 (필수)
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

  # --- JPA & Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate # 프로덕션에서는 validate 사용
    open-in-view: false
    show-sql: false # 프로덕션에서는 false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

  # --- Mail Sender (Gmail SMTP) ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:amumu7700@gmail.com}
    password: ${MAIL_PASSWORD} # 환경 변수에서 주입
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  # --- File Upload ---
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # --- JSON & Timezone ---
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  # =================================================================
  # Thymeleaf 설정
  # =================================================================
  thymeleaf:
    cache: true # 프로덕션에서는 캐시 활성화
    prefix: classpath:/templates/
    suffix: .html

  # ===================================================================
  # OAuth2 : NAVER, GOOGLE
  # ===================================================================
  # 주의: redirect-uri를 실제 EC2 IP 또는 도메인으로 변경하세요
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:dYMyrfa3rgIKuDwUYZyH}
            client-secret: ${NAVER_CLIENT_SECRET:HwVQiFUqAQ}
            scope:
              - name
              - email
            client-name: naver
            authorization-grant-type: authorization_code
            redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8081/login/oauth2/code/naver}
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID:1009179449495-uqphuqqd21h1919m4354agk1cjottn33.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# ===================================================================
# MYBATIS CONFIGURATION
# ===================================================================
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.boot.eumbank.dto
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl # 프로덕션에서는 Slf4j 사용
    map-underscore-to-camel-case: true

# ===================================================================
# CUSTOM APPLICATION PROPERTIES
# ===================================================================
app:
  # --- CORS ---
  # 주의: 실제 도메인 또는 IP로 변경하세요
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

  # --- Email Verification ---
  email:
    verify:
      expire-minutes: 15
    code:
      secret: ${EMAIL_CODE_SECRET:K7k6x7w4Y7xV1X7y0i3o9kq2PqZB1k4mQ9l2s6u8v0w3x5y7z9A==}
      exp-min: 15
      period-seconds: 60
      clock-skew: 1

# ===================================================================
# EXTERNAL API CONFIGURATION
# ===================================================================
# --- Naver Clova OCR ---
clova:
  ocr:
    url: ${CLOVA_OCR_URL}
    secret: ${CLOVA_OCR_SECRET}

# --- Korea EXIM API ---
exim:
  api:
    base: https://www.koreaexim.go.kr/site/program/financial/exchangeJSON
    key: ${EXIM_API_KEY:GWHvpofCSHfJ4eumZdAavLgNkl8J4qme}

# ===================================================================
# JWT (JSON Web Token) CONFIGURATION
# ===================================================================
jwt:
  access:
    secret: ${JWT_ACCESS_SECRET:change-this-to-a-very-long-random-access-secret-at-least-64-bytes}
    ttl-seconds: 36000
  refresh:
    secret: ${JWT_REFRESH_SECRET:change-this-to-a-very-long-random-refresh-secret-at-least-64-bytes}
    ttl-seconds: 86400

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging:
  level:
    root: INFO
    com.boot.eumbank: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: /var/log/eumbank/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ===================================================================
# 금감원 대출API
# ===================================================================
finlife:
  base-url: "https://finlife.fss.or.kr"
  api-key: ${FINLIFE_API_KEY:b8026175e9f7ea9382ca8f19aa8c3fe7}

jobs:
  finlife:
    sync:
      cron: "0 */1 * * * *"
  timezone: "Asia/Seoul"

# ==================================
# --- Gemini API ---
# ==================================
gemini:
  api:
    key: ${GEMINI_API_KEY}
  model: gemini-2.0-flash-exp

# ===================================================================
# firebase Cloud Messaging
# ===================================================================
firebase:
  service-account:
    path: eumbank-86fbd-firebase-adminsdk-fbsvc-d3d743c1eb.json
  project-id: eumbank-86fbd



