# --- Server ---
server.port=8081

# --- MariaDB ---
spring.datasource.url=jdbc:mariadb://localhost:3306/eum_bank?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=eum_bank
spring.datasource.password=bank
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JSON, Time ---
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# --- CORS (???: ??? 3000 ??) ---
app.cors.allowed-origins=http://localhost:3000

# --- JWT (?? ???/????: ??? ??) ---
app.jwt.secret=change-this-to-a-very-long-random-secret-at-least-64-bytes
app.jwt.access-exp-min=60
app.jwt.refresh-exp-day=14
