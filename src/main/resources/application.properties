# --- Server ---
server.port=8081

# --- MariaDB ---
spring.datasource.url=jdbc:mariadb://localhost:3306/eum_bank?useUnicode=true&characterEncoding=utf8&sessionVariables=time_zone='+00:00'
spring.datasource.username=eum_bank
spring.datasource.password=bank
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JSON, Time ---
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# --- CORS ---
app.cors.allowed-origins=http://localhost:3000

# --- JWT ---
jwt.access.secret=change-this-to-a-very-long-random-access-secret-at-least-64-bytes
jwt.refresh.secret=change-this-to-a-very-long-random-refresh-secret-at-least-64-bytes
jwt.access.ttl-seconds=1800
jwt.refresh.ttl-seconds=604800


