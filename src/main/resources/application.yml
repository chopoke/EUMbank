# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server:
  port: 8081 # .properties 파일의 설정 적용

# ===================================================================
# SPRING FRAMEWORK CONFIGURATION
# ===================================================================
spring:
  application:
    name: eum_bank # .properties 파일의 설정 적용

  # --- Database Connection (MariaDB) ---
  # 기존 .yml 파일의 MariaDB 설정을 유지합니다.
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/eum_bank?sessionVariables=time_zone='+00:00'
    username: ${DB_USER} # 환경 변수에서 주입
    password: ${DB_PASS} # 환경 변수에서 주입
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

  # --- JPA & Hibernate ---
  # .properties 파일의 설정 기준으로 병합되었습니다.
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate # none -> validate로 변경
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # --- Mail Sender (Gmail SMTP) ---
  # .properties 파일에서 가져온 새로운 설정입니다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: amumu7700@gmail.com
    password: rkiixxqyoaqiqdyp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

  # --- File Upload ---
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # --- JSON & Timezone ---
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  # ===================================================================
  # OAuth2 : NAVER, GOOGLE
  # ===================================================================

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: dYMyrfa3rgIKuDwUYZyH
            client-secret: HwVQiFUqAQ
            scope:
              - name
              - email
            client-name: naver
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8081/login/oauth2/code/naver
          google:
            client-name: google
            client-id: 1009179449495-uqphuqqd21h1919m4354agk1cjottn33.apps.googleusercontent.com
            client-secret: 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
            redirect-uri: http://localhost:8081/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# ===================================================================
