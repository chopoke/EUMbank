<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/admin-layout :: layout (~{::content})}">

<th:block th:fragment="content">
    <section class="dashboard-section">
        <div class="dashboard-header">
            <h2 class="dashboard-title">Service Overview</h2>
        </div>

        <!-- 통계 카드 (8개 항목) - 2열 4행 레이아웃 -->
        <div class="stats-grid-2col">
            <div th:each="stat: ${stats}" class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-icon-wrapper" 
                         th:classappend="${stat.iconColor != null and stat.iconColor != ''} ? ('stat-icon-wrapper-' + ${stat.iconColor}) : ''">
                        <!-- FontAwesome 아이콘 -->
                        <i th:if="${stat.icon != null and stat.icon != '' and stat.icon.startsWith('fa-')}" 
                           th:class="${stat.icon} + ' stat-icon'"></i>
                        <!-- RemixIcon 아이콘 -->
                        <i th:if="${stat.icon != null and stat.icon != '' and stat.icon.startsWith('ri-')}" 
                           th:class="${stat.icon} + ' stat-icon'"></i>
                    </div>
                    <div class="stat-info">
                        <p class="stat-title" th:text="${stat.title}">Title</p>
                        <p class="stat-value" th:text="${stat.value}">0</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>

</html>
