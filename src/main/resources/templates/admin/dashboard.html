<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="ko"><head>
    <meta charset="UTF-8"><title>Admin | Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head><body>
<div class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-lg shadow-sm p-6" th:each="stat: ${stats}">
            <div class="flex items-center">
                <div class="p-3 rounded-lg bg-gray-50" th:classappend="' ' + ${stat.color}">
                    <i th:class="${stat.icon} + ' text-2xl'"></i>
                </div>
                <div class="ml-4">
                    <p class="text-sm font-medium text-gray-600" th:text="${stat.title}">Title</p>
                    <p class="text-2xl font-bold text-gray-900" th:text="${stat.value}">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-lg shadow-sm">
            <div class="p-6 border-b border-gray-200"><h3 class="text-lg font-semibold text-gray-900">Recent Loans</h3></div>
            <div class="p-6">
                <div class="space-y-4">
                    <div class="grid grid-cols-4 gap-4 text-sm font-medium text-gray-500 border-b pb-2">
                        <span>Name</span><span>Amount</span><span>Loan Date</span><span>Status</span>
                    </div>
                    <div class="grid grid-cols-4 gap-4 text-sm py-2" th:each="loan: ${recentLoans}">
                        <span class="text-gray-900" th:text="${loan.name}">-</span>
                        <span class="text-gray-900" th:text="${loan.amount}">-</span>
                        <span class="text-gray-600" th:text="${loan.date}">-</span>
                        <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-medium w-fit" th:text="${loan.status}">Active</span>
                    </div>
                </div>
                <div class="mt-4 text-center"><button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">View All</button></div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm">
            <div class="p-6 border-b border-gray-200"><h3 class="text-lg font-semibold text-gray-900">Recent Inquiries</h3></div>
            <div class="p-6">
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4 text-sm font-medium text-gray-500 border-b pb-2">
                        <span>Subject</span><span>Status</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-sm py-2" th:each="inq: ${recentInquiries}">
                        <span class="text-gray-900" th:text="${inq.subject}">-</span>
                        <span class="px-2 py-1 bg-orange-100 text-orange-800 rounded-full text-xs font-medium w-fit" th:text="${inq.status}">Pending</span>
                    </div>
                </div>
                <div class="mt-4 text-center"><button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">View All</button></div>
            </div>
        </div>
    </div>
</div>
</body></html>
