<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <style>
        /* 푸터 반응형 스타일 - 갤럭시 폴드 접힘 기준 (280px) */
        .main-footer {
            background-color: #f9fafb;
            border-top: 1px solid #e5e7eb;
            margin-top: auto;
        }
        
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1.5rem; /* gap-6 = 24px */
        }
        
        .footer-col {
            min-width: 0;
        }
        
        .footer-title {
            font-weight: 500;
            color: #111827;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        
        .footer-col > p {
            margin-top: 0;
            margin-bottom: 0.25rem;
            font-size: 0.75rem;
            line-height: 1.5;
        }
        
        .footer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .footer-list > li {
            margin-bottom: 0.375rem;
            font-size: 0.75rem;
            line-height: 1.5;
        }
        
        .footer-list a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s;
        }
        
        .footer-list a:hover,
        .hover-underline:hover {
            text-decoration: underline;
            color: #1f3a8a;
        }
        
        .copyright {
            margin-top: 0.5rem;
            color: #6b7280;
            font-size: 0.75rem;
        }
        
        .footer-sns {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }
        
        .footer-sns a {
            color: #4b5563;
            transition: color 0.2s;
        }
        
        .footer-sns a:hover {
            color: #1f3a8a;
        }
        
        .footer-sns i {
            font-size: 20px;
        }
        
        /* 갤럭시 폴드 접힘: 280px ~ 480px */
        @media (min-width: 280px) {
            .content-container {
                padding-left: 1rem; /* 16px */
                padding-right: 1rem; /* 16px */
            }
            
            .py-10 {
                padding-top: 2rem; /* 32px */
                padding-bottom: 2rem; /* 32px */
            }
            
            .footer-grid {
                gap: 1rem;
            }
            
            .footer-title {
                font-size: 0.8125rem;
            }
            
            .footer-col > p,
            .footer-list > li {
                font-size: 0.6875rem;
            }
            
            .footer-sns i {
                font-size: 18px;
            }
        }
        
        /* 작은 모바일: 481px ~ 640px */
        @media (min-width: 481px) {
            .content-container {
                padding-left: 1.5rem; /* 24px */
                padding-right: 1.5rem; /* 24px */
            }
            
            .py-10 {
                padding-top: 2.5rem; /* 40px */
                padding-bottom: 2.5rem; /* 40px */
            }
            
            .footer-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1.25rem;
            }
            
            .footer-title {
                font-size: 0.875rem;
            }
            
            .footer-col > p,
            .footer-list > li {
                font-size: 0.75rem;
            }
            
            .footer-sns i {
                font-size: 20px;
            }
        }
        
        /* 태블릿: 641px ~ 1024px */
        @media (min-width: 641px) {
            .footer-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1.5rem;
            }
            
            .footer-col > p,
            .footer-list > li {
                font-size: 0.8125rem;
            }
            
            .footer-sns {
                gap: 1rem;
            }
            
            .footer-sns i {
                font-size: 22px;
            }
        }
        
        /* 데스크톱: 1025px 이상 */
        @media (min-width: 1025px) {
            .footer-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 1.5rem;
            }
            
            .footer-col > p,
            .footer-list > li {
                font-size: 0.875rem;
            }
            
            .footer-sns {
                gap: 1rem;
            }
            
            .footer-sns i {
                font-size: 24px;
            }
        }
    </style>
</head>
<th:block th:fragment="footer">
    <footer class="main-footer">
        <div class="content-container py-10 footer-content">
            <div class="footer-grid">
                <!-- E-UMBank 정보 -->
                <div class="footer-col">
                    <div class="footer-title">E-UMBank</div>
                    <p>사업자등록번호 123-45-67890</p>
                    <p>대표 ㈜이음은행</p>
                </div>
                
                <!-- 약관 -->
                <div class="footer-col">
                    <div class="footer-title">약관</div>
                    <ul class="footer-list">
                        <li><a th:href="@{/ftagree}" class="hover-underline">전자금융거래약관</a></li>
                        <li><a th:href="@{/ftprivacy}" class="hover-underline">개인정보 처리방침</a></li>
                        <li><a th:href="@{/ftdisclosure}" class="hover-underline">경영공시</a></li>
                    </ul>
                </div>
                
                <!-- 고객지원 -->
                <div class="footer-col">
                    <div class="footer-title">고객지원</div>
                    <ul class="footer-list">
                        <li>고객센터 02-000-0000</li>
                        <li>평일 AM 09:30 ~ PM 06:30</li>
                        <li>휴무 : 토,일요일 및 공휴일</li>
                    </ul>
                </div>
                
                <!-- 인증 및 SNS -->
                <div class="footer-col">
                    <div class="footer-title">인증</div>
                    <p>ISMS · 개인정보보호 인증</p>
                    <p class="copyright">© 2025 E-UMBank</p>
                    <div class="footer-sns">
                        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                            <i class="ri-youtube-fill"></i>
                        </a>
                        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                            <i class="ri-instagram-fill"></i>
                        </a>
                        <a href="https://www.facebook.com/?locale=ko_KR/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                            <i class="ri-facebook-fill"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</th:block>
</html>
