<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="admin-sidebar-content bg-white border-r px-4 py-6 space-y-1">

    <!-- 대시보드 -->
    <a th:href="@{/admin/dashboard}"
       class="flex items-center gap-3 px-3 py-2 rounded-lg"
       th:classappend="${activeMenu}=='dashboard' ? ' bg-blue-50 text-blue-600 font-medium' : ' hover:bg-gray-100 text-gray-700'">
        <i class="ri-dashboard-line text-[18px]"></i>
        <span>대시보드(전체)</span>
    </a>

    <!-- 대출 관리 -->
    <a th:href="@{/admin/loan}"
       class="flex items-center gap-3 px-3 py-2 rounded-lg"
       th:classappend="${activeMenu}=='loan' ? ' bg-blue-50 text-blue-600 font-medium' : ' hover:bg-gray-100 text-gray-700'">
        <i class="ri-bank-line text-[18px]"></i>
        <span>대출 관리</span>
    </a>

    <!-- 예/적금 관리 (React 3000으로 이동) -->
    <a href="http://localhost:3000/admin"
       class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-700"
       rel="noopener noreferrer">
        <i class="ri-safe-line text-[18px]"></i>
        <span>예/적금 관리</span>
    </a>

    <!-- 현물관리 (React 3000으로 이동) -->
    <a href="http://localhost:3000/admin"
       class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 text-gray-700"
       rel="noopener noreferrer">
        <i class="ri-coins-line text-[18px]"></i>
        <span>현물관리</span>
    </a>

    <!-- 회원관리 -->
    <a th:href="@{/admin/user}"
       class="flex items-center gap-3 px-3 py-2 rounded-lg"
       th:classappend="${activeMenu}=='user' ? ' bg-blue-50 text-blue-600 font-medium' : ' hover:bg-gray-100 text-gray-700'">
        <i class="ri-user-line text-[18px]"></i>
        <span>회원관리</span>
    </a>

    <!-- 인증관리 -->
    <a th:href="@{/admin/verification}"
       class="flex items-center gap-3 px-3 py-2 rounded-lg"
       th:classappend="${activeMenu}=='verification' ? ' bg-blue-50 text-blue-600 font-medium' : ' hover:bg-gray-100 text-gray-700'">
        <i class="ri-shield-check-line text-[18px]"></i>
        <span>인증관리</span>
    </a>

</aside>
</body>
</html>
