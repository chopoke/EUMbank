<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/admin-layout :: layout (~{::content})}">

<th:block th:fragment="content">

    <!-- 상단 헤더: 뒤로가기 + 타이틀 + 상태 + 액션 -->
    <div class="flex items-center justify-between mb-6">

        <!-- 좌측: 뒤로가기 & 타이틀 -->
        <div class="flex flex-col gap-1">
            <a th:href="@{/admin/loan/applications}"
               class="inline-flex items-center text-xs text-gray-400 hover:text-indigo-500">
                <i class="ri-arrow-left-line mr-1 text-[14px]"></i>
                대출 신청 관리
            </a>

            <div class="flex items-center gap-3 mt-1">
                <div class="flex items-center gap-2">
                    <i class="ri-file-list-3-line text-indigo-500 text-xl"></i>
                    <h2 class="text-2xl font-semibold text-gray-900">대출 신청 상세</h2>
                </div>

                <!-- 상태 뱃지 -->
                <span class="px-2 py-1 rounded-full text-[10px] font-semibold inline-flex items-center gap-1"
                      th:text="${summary.applyStatus}"
                      th:classappend="${
                        summary.applyStatus == 'SUBMITTED' ? ' bg-yellow-50 text-yellow-700' :
                        (summary.applyStatus == 'UNDER_REVIEW' ? ' bg-blue-50 text-blue-700' :
                        (summary.applyStatus == 'APPROVED' ? ' bg-emerald-50 text-emerald-700' :
                        (summary.applyStatus == 'REJECTED' ? ' bg-red-50 text-red-600' :
                        ' bg-gray-50 text-gray-500')))}">
                </span>

                <!-- 신청 ID 뱃지 -->
                <span class="px-2 py-1 rounded-full bg-gray-100 text-[10px] text-gray-600">
                    ID: <span class="font-semibold" th:text="${summary.laId}"></span>
                </span>
            </div>
        </div>

        <!-- 우측: SUBMITTED 일 때만 '심사 시작' -->
        <div th:if="${summary.applyStatus == 'SUBMITTED'}">
            <form th:action="@{|/admin/loan/applications/${summary.laId}/start-review|}"
                  method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        class="inline-flex items-center gap-1 px-4 py-2 rounded-xl
                               bg-indigo-50 text-indigo-600 text-xs border border-indigo-200
                               hover:bg-indigo-100 transition">
                    <i class="ri-play-circle-line text-sm"></i>
                    <span>심사 시작</span>
                </button>
            </form>
        </div>
    </div>

    <!-- 1. 정보 영역: 좌 기본, 우 심사요약 -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

        <!-- 기본 정보 (2/3) -->
        <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border px-6 py-5">
            <div class="flex items-center gap-2 mb-3">
                <i class="ri-user-3-line text-indigo-500"></i>
                <h3 class="font-semibold text-gray-900">기본 정보</h3>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 text-sm text-gray-600">
                <p>
                    <span class="text-gray-500">신청ID</span>
                    <span class="ml-2 font-medium text-gray-900"
                          th:text="${summary.laId}"></span>
                </p>
                <p>
                    <span class="text-gray-500">고객번호</span>
                    <span class="ml-2" th:text="${summary.cNo}"></span>
                </p>
                <p class="md:col-span-2">
                    <span class="text-gray-500">상품명</span>
                    <span class="ml-2 font-medium text-gray-900"
                          th:text="${summary.productName}"></span>
                </p>
                <p>
                    <span class="text-gray-500">신청금액</span>
                    <span class="ml-2 font-semibold text-gray-900"
                          th:text="${#numbers.formatInteger(summary.applyAmount,0,'COMMA')} + '원'"></span>
                </p>
                <p>
                    <span class="text-gray-500">신청기간</span>
                    <span class="ml-2" th:text="${summary.desiredTerm} + '개월'"></span>
                </p>
                <p>
                    <span class="text-gray-500">신청일시</span>
                    <span class="ml-2"
                          th:text="${#temporals.format(summary.submitDate,'yyyy-MM-dd HH:mm')}"></span>
                </p>
                <p>
                    <span class="text-gray-500">입금계좌</span>
                    <span class="ml-2"
                          th:text="${dto.payoutAccountNumber} ?: '-'"></span>
                </p>
                <p>
                    <span class="text-gray-500">상환계좌</span>
                    <span class="ml-2"
                          th:text="${dto.repayAccountNumber} ?: '-'"></span>
                </p>
            </div>
        </div>

        <!-- 심사 / 승인 요약 (1/3) -->
        <div class="bg-white rounded-2xl shadow-sm border px-6 py-5">
            <div class="flex items-center gap-2 mb-3">
                <i class="ri-clipboard-line text-indigo-500"></i>
                <h3 class="font-semibold text-gray-900">심사 / 승인 정보</h3>
            </div>

            <div class="space-y-1.5 text-sm text-gray-600">
                <p>
                    <span class="text-gray-500">승인금액</span>
                    <span class="ml-2"
                          th:text="${dto.approvedAmount} ?: '-'"></span>
                </p>
                <p>
                    <span class="text-gray-500">승인기간</span>
                    <span class="ml-2"
                          th:text="${dto.approvedTerm} ?: '-'"></span>
                </p>
                <p>
                    <span class="text-gray-500">승인금리</span>
                    <span class="ml-2"
                          th:text="${dto.approvedRate} ?: '-'"></span>
                </p>
                <p>
                    <span class="text-gray-500">심사일시</span>
                    <span class="ml-2"
                          th:text="${dto.reviewedAt} ?: '-'"></span>
                </p>
                <p class="pt-1">
                    <span class="text-gray-500">반려사유</span>
                    <span class="ml-2 text-red-500"
                          th:text="${dto.rejectReason} ?: '-'"></span>
                </p>
            </div>

            <div class="mt-4 text-[11px] text-gray-400 border-t pt-2"
                 th:if="${summary.applyStatus == 'SUBMITTED'}">
                심사 시작 버튼을 누르면 상태가 <b class="text-blue-500">UNDER_REVIEW</b> 로 변경됩니다.
            </div>
            <div class="mt-4 text-[11px] text-gray-400 border-t pt-2"
                 th:if="${summary.applyStatus == 'UNDER_REVIEW'}">
                아래 승인 / 반려 처리 영역에서 최종 결정을 입력할 수 있습니다.
            </div>
        </div>

    </section>

    <!-- 2. 승인 / 반려 폼 (UNDER_REVIEW에서만 노출) -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6"
             th:if="${summary.applyStatus == 'UNDER_REVIEW'}">

        <!-- 승인 폼 -->
        <form th:action="@{|/admin/loan/applications/${summary.laId}/approve|}"
              method="post" th:object="${approveCmd}"
              class="bg-white rounded-2xl shadow-sm border px-6 py-5 space-y-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="flex items-center gap-2 mb-1">
                <i class="ri-checkbox-circle-line text-emerald-500"></i>
                <h3 class="font-semibold text-gray-900">승인 처리</h3>
            </div>

            <label class="block text-sm text-gray-700">
                승인 금액
                <input type="number" th:field="*{approvedAmount}" step="1000000"
                       class="mt-1 w-full border px-3 py-2 rounded-lg text-sm
                              focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
            </label>

            <label class="block text-sm text-gray-700">
                승인 기간(개월)
                <input type="number" th:field="*{approvedTerm}"
                       class="mt-1 w-full border px-3 py-2 rounded-lg text-sm
                              focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
            </label>

            <label class="block text-sm text-gray-700">
                적용 금리(%)
                <input type="number" step="0.01" th:field="*{approvedRate}"
                       class="mt-1 w-full border px-3 py-2 rounded-lg text-sm
                              focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
            </label>

            <label class="block text-sm text-gray-700">
                메모
                <input type="text" th:field="*{memo}"
                       class="mt-1 w-full border px-3 py-2 rounded-lg text-sm
                              focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
            </label>

            <button type="submit"
                    class="mt-2 inline-flex items-center gap-1 px-4 py-2
                           bg-emerald-500 text-white text-sm rounded-lg
                           hover:bg-emerald-600 transition">
                <i class="ri-check-line"></i>
                승인 확정
            </button>
        </form>

        <!-- 반려 폼 -->
        <form th:action="@{|/admin/loan/applications/${summary.laId}/reject|}"
              method="post" th:object="${rejectCmd}"
              class="bg-white rounded-2xl shadow-sm border px-6 py-5 space-y-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="flex items-center gap-2 mb-1">
                <i class="ri-close-circle-line text-red-500"></i>
                <h3 class="font-semibold text-gray-900">반려 처리</h3>
            </div>

            <label class="block text-sm text-gray-700">
                반려 사유
                <textarea th:field="*{reason}" rows="5"
                          class="mt-1 w-full border px-3 py-2 rounded-lg text-sm resize-y
                                 focus:outline-none focus:ring-2 focus:ring-red-400"></textarea>
            </label>

            <button type="submit"
                    class="mt-2 inline-flex items-center gap-1 px-4 py-2
                           bg-red-500 text-white text-sm rounded-lg
                           hover:bg-red-600 transition">
                <i class="ri-close-line"></i>
                반려 처리
            </button>
        </form>

    </section>

    <!-- 3. 신청서 JSON -->
    <section class="bg-white rounded-2xl shadow-sm border px-6 py-5 mb-4">
        <div class="flex items-center gap-2 mb-2">
            <i class="ri-code-box-line text-gray-500"></i>
            <h3 class="font-semibold text-gray-900">신청서 원문(JSON)</h3>
        </div>
        <pre class="w-full text-xs bg-gray-50 p-3 rounded-lg overflow-x-auto
                    whitespace-pre-wrap break-all text-gray-700"
             th:text="${dto.applicationForm}"></pre>
    </section>

</th:block>

</html>
