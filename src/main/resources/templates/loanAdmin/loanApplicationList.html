<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/admin-layout :: layout (~{::content})}">

<th:block th:fragment="content">

    <!-- 상단 타이틀 영역 (상품관리 화면과 톤 맞춤) -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex flex-col gap-1">
            <h1 class="text-2xl font-semibold text-gray-900">대출 신청 관리</h1>
            <p class="text-sm text-gray-400">대출신청 목록</p>
        </div>

        <!-- 우측: 대출상품 관리 버튼 -->
        <a th:href="@{/admin/loan/products}"
           class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-indigo-600 text-white text-sm shadow-sm
                  hover:bg-indigo-700 transition">
            <i class="ri-checkbox-multiple-line text-base"></i>
            <span>대출상품 관리</span>
        </a>
    </div>

    <!-- 검색 영역: 상단 검색바 스타일 -->
    <form th:action="@{/admin/loan/applications}" method="get"
          class="mb-4 flex flex-wrap items-center gap-3">

        <!-- 키워드 검색 -->
        <div class="relative">
            <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base"></i>
            <input type="text" name="keyword"
                   th:value="${cond.keyword}"
                   placeholder="신청번호 / 계좌번호 / ID"
                   class="w-72 h-11 pl-9 pr-3 border border-gray-200 rounded-xl text-sm
                          placeholder:text-gray-400
                          focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
        </div>

        <!-- 상태 필터 -->
        <div class="relative">
            <i class="ri-filter-2-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base"></i>
            <select name="status"
                    class="h-11 pl-9 pr-8 border border-gray-200 rounded-xl text-sm bg-white
                           focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                <option value="">전체 상태</option>
                <option value="SUBMITTED"
                        th:selected="${cond.status} == 'SUBMITTED'">SUBMITTED</option>
                <option value="UNDER_REVIEW"
                        th:selected="${cond.status} == 'UNDER_REVIEW'">UNDER_REVIEW</option>
                <option value="APPROVED"
                        th:selected="${cond.status} == 'APPROVED'">APPROVED</option>
                <option value="REJECTED"
                        th:selected="${cond.status} == 'REJECTED'">REJECTED</option>
            </select>
        </div>

        <!-- 검색 버튼 -->
        <button type="submit"
                class="h-11 px-5 inline-flex items-center gap-1 rounded-xl bg-indigo-600 text-white text-sm
                       shadow-sm hover:bg-indigo-700 transition">
            <i class="ri-search-eye-line text-base"></i>
            <span>검색</span>
        </button>
    </form>

    <!-- 목록 카드 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50/80 text-gray-500">
            <tr>
                <th class="px-5 py-3 text-left font-medium">신청ID</th>
                <th class="px-5 py-3 text-left font-medium">상품명</th>
                <th class="px-5 py-3 text-left font-medium">상태</th>
                <th class="px-5 py-3 text-right font-medium">신청금액</th>
                <th class="px-5 py-3 text-left font-medium">기간</th>
                <th class="px-5 py-3 text-left font-medium">신청일시</th>
                <th class="px-5 py-3 text-center font-medium">보기</th>
            </tr>
            </thead>

            <tbody>
            <!-- 데이터 로우 -->
            <tr th:each="item : ${page.content}"
                class="border-t border-gray-50 hover:bg-indigo-50/40 transition-colors">
                <!-- 신청ID -->
                <td class="px-5 py-3 font-medium text-gray-900"
                    th:text="${item.laId}"></td>

                <!-- 상품명 (없으면 loanName) -->
                <td class="px-5 py-3 text-gray-800"
                    th:text="${item.productName != null} ? ${item.productName} : ${item.loanName}"></td>

                <!-- 상태 배지 -->
                <td class="px-5 py-3">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-semibold"
                          th:text="${item.applyStatus}"
                          th:classappend="${
                            item.applyStatus == 'SUBMITTED' ? ' bg-yellow-50 text-yellow-700' :
                            (item.applyStatus == 'UNDER_REVIEW' ? ' bg-blue-50 text-blue-700' :
                            (item.applyStatus == 'APPROVED' ? ' bg-emerald-50 text-emerald-700' :
                            (item.applyStatus == 'REJECTED' ? ' bg-red-50 text-red-600' :
                             ' bg-gray-50 text-gray-500')))}">
                    </span>
                </td>

                <!-- 신청 금액 -->
                <td class="px-5 py-3 text-right text-gray-900"
                    th:text="${#numbers.formatInteger(item.applyAmount, 0, 'COMMA')} + '원'"></td>

                <!-- 기간 -->
                <td class="px-5 py-3 text-gray-700"
                    th:text="${item.desiredTerm} + '개월'"></td>

                <!-- 신청 일시 -->
                <td class="px-5 py-3 text-gray-500"
                    th:text="${#temporals.format(item.submitDate, 'yyyy-MM-dd HH:mm')}"></td>

                <!-- 상세 버튼 (아이콘 스타일) -->
                <td class="px-5 py-3 text-center">
                    <a th:href="@{|/admin/loan/applications/${item.laId}|}"
                       class="inline-flex items-center justify-center w-8 h-8 rounded-full
                              text-indigo-600 hover:bg-indigo-50 hover:text-indigo-700 transition"
                       title="상세 보기">
                        <i class="ri-arrow-right-line text-lg"></i>
                    </a>
                </td>
            </tr>

            <!-- 빈 목록일 때 -->
            <tr th:if="${page.content.isEmpty()}">
                <td colspan="7"
                    class="px-5 py-8 text-center text-gray-400">
                    조회 결과가 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이징: 깔끔하게 -->
    <nav th:if="${page.totalPages > 1}"
         class="mt-6 flex items-center justify-center gap-1 text-sm">

        <!-- 이전 -->
        <a th:if="${!page.first}"
           th:href="@{/admin/loan/applications(page=${page.number-1},
                     keyword=${cond.keyword}, status=${cond.status})}"
           class="px-3 py-1.5 border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">
            이전
        </a>

        <!-- 페이지 번호 -->
        <a th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
           th:href="@{/admin/loan/applications(page=${i},
                     keyword=${cond.keyword}, status=${cond.status})}"
           th:text="${i+1}"
           class="px-3 py-1.5 rounded-lg border text-gray-600"
           th:classappend="${i} == ${page.number}
                ? ' bg-indigo-600 text-white border-indigo-600'
                : ' bg-white border-gray-200 hover:bg-gray-50'">
        </a>

        <!-- 다음 -->
        <a th:if="${!page.last}"
           th:href="@{/admin/loan/applications(page=${page.number+1},
                     keyword=${cond.keyword}, status=${cond.status})}"
           class="px-3 py-1.5 border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">
            다음
        </a>
    </nav>

</th:block>

</html>
