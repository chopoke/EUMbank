<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/admin-layout :: layout (~{::content})}">

<th:block th:fragment="content">

    <!-- 상단 헤더 -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex flex-col gap-1">
            <div class="flex items-center gap-2">
                <i class="ri-bank-line text-2xl text-indigo-500"></i>
                <h1 class="text-2xl font-semibold">대출 상품 관리</h1>
            </div>
            <p class="text-xs text-gray-400">
                운영 중인 대출 상품을 조회 · 필터링 · 수정할 수 있습니다.
            </p>
        </div>

        <a th:href="@{/admin/loan/products/new}"
           class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-600 text-white text-sm
                  shadow-sm hover:bg-indigo-700">
            <i class="ri-add-line text-base"></i>
            <span>신규 상품 등록</span>
        </a>
    </div>

    <!-- 검색 / 필터 바 -->
    <form th:action="@{/admin/loan/products}" method="get"
          th:object="${dto}"
          class="mb-5 bg-white/90 backdrop-blur-sm rounded-2xl shadow-sm border border-gray-100
                 px-4 py-3 flex flex-wrap items-center gap-3">

        <!-- 키워드 -->
        <div class="relative">
            <i class="ri-search-line absolute left-3 top-2.5 text-gray-400 text-sm"></i>
            <input type="text" th:field="*{keyword}"
                   placeholder="코드 / 상품명 검색"
                   class="pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm w-64
                          focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"/>
        </div>

        <!-- 타입 필터 -->
        <select th:field="*{loanType}"
                class="border border-gray-200 px-3 py-2 rounded-lg text-sm min-w-[120px]
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">전체 종류</option>
            <!-- value는 DB의 loanType 값과 정확히 일치하게 -->
            <option value="JEONSE">전세자금</option>
            <option value="MORTGAGE">주택담보</option>
            <option value="AUTO">자동차</option>
        </select>

        <!-- 상태 필터 -->
        <select th:field="*{status}"
                class="border border-gray-200 px-3 py-2 rounded-lg text-sm min-w-[130px]
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">전체 상태</option>
            <option value="DRAFT">DRAFT</option>
            <option value="PUBLISHED">PUBLISHED</option>
            <option value="HIDDEN">HIDDEN</option>
            <option value="ARCHIVED">ARCHIVED</option>
        </select>

        <!-- 활성여부 -->
        <select th:field="*{active}"
                class="border border-gray-200 px-3 py-2 rounded-lg text-sm min-w-[110px]
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="">전체</option>
            <option th:value="true">활성만</option>
            <option th:value="false">비활성만</option>
        </select>

        <!-- page/size hidden (검색 시 1페이지로) -->
        <input type="hidden" th:field="*{size}" value="20"/>
        <input type="hidden" th:field="*{page}" value="0"/>

        <button type="submit"
                class="ml-auto px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm
                       flex items-center gap-1 hover:bg-indigo-700">
            <i class="ri-filter-2-line text-base"></i>
            <span>검색</span>
        </button>
    </form>

    <!-- 목록 테이블 -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50/80">
            <tr class="text-gray-500 text-xs">
                <th class="px-4 py-3 text-left font-medium">상품번호</th>
                <th class="px-4 py-3 text-left font-medium">코드</th>
                <th class="px-4 py-3 text-left font-medium">상품명</th>
                <th class="px-4 py-3 text-left font-medium">종류</th>
                <th class="px-4 py-3 text-left font-medium whitespace-nowrap">금리범위</th>
                <th class="px-4 py-3 text-left font-medium">최대한도</th>
                <th class="px-4 py-3 text-left font-medium">상태</th>
                <th class="px-4 py-3 text-left font-medium whitespace-nowrap">활성</th>
                <th class="px-4 py-3 text-center font-medium">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}"
                class="border-t border-gray-50 hover:bg-indigo-50/10 transition-colors">
                <td class="px-4 py-3 text-gray-700" th:text="${p.loanNo}"></td>
                <td class="px-4 py-3 text-gray-500" th:text="${p.loanCode}"></td>
                <td class="px-4 py-3 font-medium text-gray-900" th:text="${p.loanName}"></td>
                <td class="px-4 py-3 text-gray-500" th:text="${p.loanType}"></td>
                <td class="px-4 py-3 text-gray-700 whitespace-nowrap"
                    th:text="${p.rateMin != null and p.rateMax != null
                             ? p.rateMin + ' ~ ' + p.rateMax + '%'
                             : '-'}"></td>
                <td class="px-4 py-3 text-gray-800 whitespace-nowrap"
                    th:text="${p.limitMax != null
                             ? #numbers.formatInteger(p.limitMax, 0, 'COMMA') + '원'
                             : '-'}"></td>

                <!-- 상태 뱃지 -->
                <td class="px-4 py-3">
                    <span class="inline-flex items-center px-2 py-1 rounded-full text-[10px] font-semibold"
                          th:text="${p.status}"
                          th:classappend="${
                                p.status == 'PUBLISHED' ? ' bg-emerald-50 text-emerald-700' :
                                (p.status == 'DRAFT' ? ' bg-gray-50 text-gray-500' :
                                (p.status == 'HIDDEN' ? ' bg-yellow-50 text-yellow-700' :
                                (p.status == 'ARCHIVED' ? ' bg-slate-50 text-slate-500' :
                                ' bg-gray-50 text-gray-500')))}">
                    </span>
                </td>

                <!-- 활성 뱃지 -->
                <td class="px-4 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-semibold"
                          th:text="${p.isActive} ? 'Active' : 'Off'"
                          th:classappend="${p.isActive} ?
                                ' bg-indigo-50 text-indigo-600' :
                                ' bg-red-50 text-red-500'">
                    </span>
                </td>

                <!-- 관리 아이콘 -->
                <td class="px-4 py-3 text-center">
                    <div class="inline-flex items-center gap-1">
                        <a th:href="@{|/admin/loan/products/${p.loanNo}/edit|}"
                           class="inline-flex items-center justify-center w-7 h-7 rounded-md
                                  hover:bg-indigo-50 text-indigo-600"
                           title="수정">
                            <i class="ri-edit-2-line text-sm"></i>
                        </a>
                        <form th:action="@{|/admin/loan/products/${p.loanNo}/delete|}"
                              method="post" class="inline-flex">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit"
                                    class="inline-flex items-center justify-center w-7 h-7 rounded-md
                                           hover:bg-red-50 text-red-500"
                                    onclick="return confirm('해당 상품을 삭제하시겠습니까?');"
                                    title="삭제">
                                <i class="ri-delete-bin-6-line text-sm"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="9"
                    class="px-4 py-8 text-center text-gray-400 text-sm">
                    <i class="ri-information-line mr-1 align-middle"></i>
                    등록된 대출 상품이 없습니다.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav th:if="${page.totalPages > 1}"
         class="mt-4 flex items-center justify-end gap-1 text-xs">

        <!-- 이전 -->
        <a th:if="${!page.first}"
           th:href="@{/admin/loan/products(
                        page=${page.number-1},
                        size=${page.size},
                        keyword=${dto.keyword},
                        loanType=${dto.loanType},
                        status=${dto.status},
                        active=${dto.active})}"
           class="px-3 py-1 border rounded-lg bg-white hover:bg-gray-50">
            이전
        </a>

        <!-- 번호 -->
        <a th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
           th:href="@{/admin/loan/products(
                        page=${i},
                        size=${page.size},
                        keyword=${dto.keyword},
                        loanType=${dto.loanType},
                        status=${dto.status},
                        active=${dto.active})}"
           th:text="${i + 1}"
           th:classappend="${i} == ${page.number}
                ? ' bg-indigo-600 text-white'
                : ' bg-white text-gray-700 border'"
           class="px-3 py-1 rounded-lg border text-xs">
        </a>

        <!-- 다음 -->
        <a th:if="${!page.last}"
           th:href="@{/admin/loan/products(
                        page=${page.number+1},
                        size=${page.size},
                        keyword=${dto.keyword},
                        loanType=${dto.loanType},
                        status=${dto.status},
                        active=${dto.active})}"
           class="px-3 py-1 border rounded-lg bg-white hover:bg-gray-50">
            다음
        </a>
    </nav>

</th:block>
</html>
